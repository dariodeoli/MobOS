name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Unit tests compare redesign checkpoints with earlier commits (git show).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    # Actual ~1m40 · margen amplio sin colgar un runner 20 min si algo se traba.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npx prisma generate
      - name: Typecheck
        working-directory: backend
        run: npx next typegen && npx tsc --noEmit
      - name: Unit tests
        working-directory: backend
        run: npm run test:unit
      - name: Build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npm run build

  integration:
    name: Integration (backend harness, isolated Postgres)
    runs-on: ubuntu-latest
    # Actual ~3m10 (incluye build del backend) · margen ~4x.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Unit tests compare redesign checkpoints with earlier commits (git show).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_config --version
      - name: Expose Postgres binaries to the harness
        run: |
          PG_BINDIR="$(pg_config --bindir)"
          sudo mkdir -p /opt/homebrew/bin
          for binary in initdb pg_ctl createdb psql pg_dump pg_restore; do
            source="${PG_BINDIR}/${binary}"
            if [[ ! -x "$source" && -x "/usr/bin/${binary}" ]]; then source="/usr/bin/${binary}"; fi
            sudo ln -sf "$source" "/opt/homebrew/bin/${binary}"
            test -x "/opt/homebrew/bin/${binary}"
          done
      # El arnés de impresión (backend/tests/print-bridge-http.mjs) importa
      # `src/lib/printing/tickets.js`, que depende de `owncoding-ui` (raíz).
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install root dependencies (app code que usa el arnés)
        # `backend/tests/print-bridge-http.mjs` importa el builder de tickets de
        # la app, que depende de la biblioteca `owncoding-ui` del raíz.
        run: npm ci --omit=dev
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npx prisma generate
      - name: Build backend (harness requires .next/BUILD_ID)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npm run build
      - name: Run integration suite (own ephemeral Postgres cluster)
        working-directory: backend
        env:
          MOBOS_IT_EXECUTE: "1"
          PG_BIN: /opt/homebrew/bin
        run: bash tests/integration-http.sh
      - name: Native identity security (isolated Postgres, simulated providers)
        working-directory: backend
        env:
          PG_BIN: /opt/homebrew/bin
        run: node tests/ios-backend.mjs
      - name: Product photo derivatives and bounded uploads
        working-directory: backend
        env:
          PG_BIN: /opt/homebrew/bin
        run: env -u DATABASE_URL -u DIRECT_URL node tests/product-thumbs404-pg.mjs

  e2e:
    # Shards en paralelo (#CI/#333): la suite completa tarda ~48 min en un
    # runner lento; con 4 shards balanceados por duración (#333) cada job queda
    # en ~19 min de tests + ~3 min de setup ≈ 22 min. Cada shard tiene su propio
    # runner, cluster de Postgres y WebServer (arnés aislado), así que no
    # comparten nada.
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # ~22 min estimados (tests + setup) + margen para la varianza del runner.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_config --version
      - name: Expose Postgres binaries to the harness
        run: |
          PG_BINDIR="$(pg_config --bindir)"
          sudo mkdir -p /opt/homebrew/bin
          for binary in initdb pg_ctl createdb psql pg_dump pg_restore; do
            source="${PG_BINDIR}/${binary}"
            if [[ ! -x "$source" && -x "/usr/bin/${binary}" ]]; then source="/usr/bin/${binary}"; fi
            sudo ln -sf "$source" "/opt/homebrew/bin/${binary}"
            test -x "/opt/homebrew/bin/${binary}"
          done
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npx prisma generate
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Private API service worker isolation
        if: matrix.shard == 1
        run: npx playwright test --config e2e/sw-isolation.frontend.config.js
      - name: RUC demo and mobile regressions
        if: matrix.shard == 1
        env:
          MOBOS_QA_PORT: "5297"
          MOBOS_QA_OUT: /tmp/mobos-ruc498-ci
          MOBOS_QA_SCREENSHOTS: "0"
        run: npx playwright test --config e2e/ruc498-all.frontend.config.js
      - name: Private POS snapshot context isolation
        if: matrix.shard == 1
        env:
          MOBOS_QA_PORT: "5342"
        run: npx playwright test --config e2e/snapshot502.frontend.config.js
      - name: Private product photo cache access isolation
        if: matrix.shard == 1
        env:
          MOBOS_QA_PORT: "5354"
        run: npx playwright test --config e2e/images404.frontend.config.js
      - name: Printed document company branding
        if: matrix.shard == 1
        env:
          MOBOS_QA_PORT: "5341"
          MOBOS_QA_OUT: /tmp/mobos-print402-ci
        run: npx playwright test --config e2e/printing402.frontend.config.js
      - name: Public document branding and privacy UI
        if: matrix.shard == 2
        env:
          MOBOS_QA_PORT: "5334"
          MOBOS_QA_OUT: /tmp/mobos-public403-ci
        run: npx playwright test --config e2e/publicas-extra.frontend.config.js
      - name: Global search respects role capabilities
        if: matrix.shard == 2
        run: npx playwright test --config e2e/busqueda510.frontend.config.js
      - name: Public documents wrapping, contrast and legacy tokens
        if: matrix.shard == 2
        run: npx playwright test --config e2e/publicas403-restantes.frontend.config.js
      - name: Public warranty and transfer authorized branding
        if: matrix.shard == 2
        run: npx playwright test --config e2e/public-brand403.frontend.config.js
      - name: Saved print templates and PDF composition
        if: matrix.shard == 1
        run: npx playwright test --config e2e/plantillas507-adopcion.frontend.config.js
      - name: Printed raster QR and tenant context isolation
        if: matrix.shard == 1
        run: npx playwright test --config e2e/print513.frontend.config.js
      - name: Platform navigation and session controls
        if: matrix.shard == 2
        run: npx playwright test --config e2e/superadmin508.frontend.config.js
      - name: POS effective price and branch stock preview
        if: matrix.shard == 2
        env:
          MOBOS_QA_PORT: "5359"
          MOBOS_QA_OUT: /tmp/mobos-precios559-ci
        run: npx playwright test --config e2e/precios559.frontend.config.js
      - name: Mobile PIN and login layout
        if: matrix.shard == 3
        env:
          MOBOS_QA_PORT: "5344"
        run: npx playwright test --config e2e/pin-login504.frontend.config.js
      - name: Tactile PIN while changing seller
        if: matrix.shard == 3
        env:
          MOBOS_QA_PORT: "5350"
          MOBOS_QA_OUT: /tmp/mobos-pin484-ci
        run: npx playwright test --config e2e/pin-cambio484.frontend.config.js
      - name: Mobile typography and shortcut contrast
        if: matrix.shard == 3
        env:
          MOBOS_QA_PORT: "5353"
        run: npx playwright test --config e2e/responsive396.frontend.config.js
      - name: Product photo framing and access transitions
        if: matrix.shard == 3
        env:
          MOBOS_QA_PORT: "5355"
        run: npx playwright test --config e2e/crop404.frontend.config.js

      - name: Product photos in quote summaries and protected detail
        if: matrix.shard == 1
        run: npx playwright test --config e2e/product-consumers404.frontend.config.js

      - name: Premium quick receipts and source context
        if: matrix.shard == 2
        run: npx playwright test --config e2e/quick-receipt513.frontend.config.js
      - name: Shared web and native login presentation
        if: matrix.shard == 4
        env:
          MOBOS_QA_PORT: "5399"
        run: npx playwright test --config e2e/auth516.frontend.config.js
      - name: Shared mobile shell, checkout, customers and account layout
        if: matrix.shard == 4
        run: npx playwright test --config e2e/paridad-shell516.frontend.config.js
      - name: Demo quote, cash and reception flows
        if: matrix.shard == 4
        env:
          MOBOS_QA_PORT: "5345"
        run: npx playwright test --config e2e/demo461.frontend.config.js
      - name: Demo access and public report layout
        if: matrix.shard == 4
        run: npx playwright test --config e2e/demo-acceso.frontend.config.js
      - name: Demo profiles and theme branding
        if: matrix.shard == 4
        env:
          MOBOS_QA_PORT: "5351"
        run: npx playwright test --config e2e/demo350.frontend.config.js
      - name: Demo memory context and reload isolation
        if: matrix.shard == 4
        env:
          MOBOS_QA_PORT: "5352"
        run: npx playwright test --config e2e/demo350-scope.frontend.config.js
      - name: Demo customer card save, edits and reset
        if: matrix.shard == 4
        env:
          MOBOS_QA_PORT: "5391"
        run: npx playwright test --config e2e/demo350-clientes.frontend.config.js
      - name: Build backend (prod-mode E2E server)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npm run build
      - name: Run E2E suite (shard ${{ matrix.shard }}/4)
        env:
          # El harness arranca el backend con `next start` sobre este build: sin
          # compilación por ruta no hay requests cortadas durante el compile ni
          # timeouts por primeros hits lentos (flakiness de CI).
          MOBOS_E2E_BACKEND: prod
        # Shards balanceados por duración medida + overhead de setup (#333:
        # e2e/tiempos.json → e2e/sharding.json; matriz 1-4). Nada de
        # reintentos: un flake se aísla y se corrige la raíz (#245).
        run: npx playwright test $(node scripts/e2e-shards.mjs --shard ${{ matrix.shard }})
      - name: Upload Playwright report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/reporte-flaky.md
            test-results/reporte-flaky.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
            /tmp/mobos-superadmin508/results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-aggregate:
    name: E2E (Playwright + self-hosted backend/Postgres)
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all E2E shards to succeed
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$E2E_RESULT" != "success" ]; then
            echo "E2E matrix did not succeed: ${E2E_RESULT:-unknown}"
            exit 1
          fi
          echo "All four E2E shards succeeded."
