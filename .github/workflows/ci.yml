name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    # Actual ~1m40 · margen amplio sin colgar un runner 20 min si algo se traba.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npx prisma generate
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: backend
        run: npm run test:unit
      - name: Build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npm run build

  integration:
    name: Integration (backend harness, isolated Postgres)
    runs-on: ubuntu-latest
    # Actual ~3m10 (incluye build del backend) · margen ~4x.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_config --version
      - name: Expose Postgres binaries to the harness
        run: |
          PG_BINDIR="$(pg_config --bindir)"
          sudo mkdir -p /opt/homebrew/bin
          for binary in initdb pg_ctl createdb psql pg_dump pg_restore; do
            source="${PG_BINDIR}/${binary}"
            if [[ ! -x "$source" && -x "/usr/bin/${binary}" ]]; then source="/usr/bin/${binary}"; fi
            sudo ln -sf "$source" "/opt/homebrew/bin/${binary}"
            test -x "/opt/homebrew/bin/${binary}"
          done
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npx prisma generate
      - name: Build backend (harness requires .next/BUILD_ID)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npm run build
      - name: Run integration suite (own ephemeral Postgres cluster)
        working-directory: backend
        env:
          MOBOS_IT_EXECUTE: "1"
          PG_BIN: /opt/homebrew/bin
        run: bash tests/integration-http.sh

  e2e:
    # Shards en paralelo (#CI): la suite completa tarda ~20+ min en un runner;
    # con 3 shards cada job baja a ~8-10 min. Cada shard tiene su propio runner,
    # cluster de Postgres y WebServer (arnés aislado), así que no comparten nada.
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_config --version
      - name: Expose Postgres binaries to the harness
        run: |
          PG_BINDIR="$(pg_config --bindir)"
          sudo mkdir -p /opt/homebrew/bin
          for binary in initdb pg_ctl createdb psql pg_dump pg_restore; do
            source="${PG_BINDIR}/${binary}"
            if [[ ! -x "$source" && -x "/usr/bin/${binary}" ]]; then source="/usr/bin/${binary}"; fi
            sudo ln -sf "$source" "/opt/homebrew/bin/${binary}"
            test -x "/opt/homebrew/bin/${binary}"
          done
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npx prisma generate
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build backend (prod-mode E2E server)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mobos
        run: npm run build
      - name: Run E2E suite (shard ${{ matrix.shard }}/3)
        env:
          # El harness arranca el backend con `next start` sobre este build: sin
          # compilación por ruta no hay requests cortadas durante el compile ni
          # timeouts por primeros hits lentos (flakiness de CI).
          MOBOS_E2E_BACKEND: prod
        # Shards balanceados por archivo (e2e/sharding.json → 103/102/102):
        # la heurística de Playwright dejaba 135/73/99. Nada de reintentos:
        # un flake se aísla y se corrige la raíz (#245).
        run: npx playwright test $(node scripts/e2e-shards.mjs --shard ${{ matrix.shard }})
      - name: Upload Playwright report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/reporte-flaky.md
            test-results/reporte-flaky.json
          if-no-files-found: ignore
          retention-days: 14
