name: Reporte de bug
description: Algo no funciona como debería
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Contá el problema con el mayor detalle posible.
      placeholder: Al guardar un pedido la pantalla queda en blanco…
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Uno por línea, empezando por dónde entraste.
      placeholder: |
        1. Entrar a Pedidos
        2. Abrir un pedido
        3. Tocar "Cobrar"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pase
      placeholder: Que el pago quede registrado y el saldo baje.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué pasó en realidad
      description: Si hay un mensaje de error, pegalo tal cual.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      description: Dónde lo viste.
      options:
        - Clientes
        - Pedidos y ventas
        - Stock e inventario
        - Caja y finanzas
        - Servicio técnico
        - Configuración y equipo
        - Otra
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: Dónde lo viste
      description: Sucursal y dispositivo o navegador, si aplica.
      placeholder: ASU · Chrome en Android
    validations:
      required: false
