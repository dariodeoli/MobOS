<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MobOS POS · prototipo de rediseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:241 244 248; --fore:14 17 22; --surf:255 255 255; --surf2:248 250 253; --line:213 220 230;
  --mute:71 85 105; --brand:16 185 129; --brand-d:4 120 87; --brand-soft:236 253 245; --onbrand:4 28 18;
  --ok:22 101 52; --bad:185 28 28; --warn:146 64 14; --warn-soft:254 243 220; --info:32 89 190;
  --r:16px; --sans:'Inter',system-ui,sans-serif; --disp:'Space Grotesk','Inter',sans-serif;
}
:root[data-theme=dark]{
  --paper:14 17 22; --fore:244 246 250; --surf:31 36 48; --surf2:24 28 38; --line:52 60 78;
  --mute:160 172 190; --brand:5 241 156; --brand-d:5 241 156; --brand-soft:16 52 40; --onbrand:4 28 18;
  --ok:110 220 150; --bad:250 140 140; --warn:253 230 138; --warn-soft:60 48 14; --info:159 184 255;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:rgb(var(--paper));color:rgb(var(--fore));font:14px/1.35 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,button,label{font-family:var(--disp)}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
.mute{color:rgb(var(--mute))}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgb(var(--surf));border-bottom:1px solid rgb(var(--line))}
.logo{height:30px;width:30px;border-radius:10px;background:#071018;display:grid;place-items:center;flex:none}
.logo i{width:12px;height:18px;border:2px solid #15d7b8;border-radius:4px;display:block}
.brandname{font:700 17px var(--disp)}
.searchbox{flex:1;display:flex;align-items:center;gap:8px;background:rgb(var(--surf2));border:1px solid rgb(var(--line));border-radius:12px;padding:0 12px;height:44px;min-width:0}
.searchbox:focus-within{border-color:rgb(var(--brand));box-shadow:0 0 0 3px rgb(var(--brand)/.2)}
.searchbox input{flex:1;border:0;background:none;outline:0;min-width:0;height:100%}
.btn{height:44px;padding:0 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgb(var(--line));background:rgb(var(--surf));white-space:nowrap;position:relative}
.btn:active{transform:scale(.97)}
.btn.pri{background:rgb(var(--brand));color:rgb(var(--onbrand));border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sq{width:44px;padding:0}
.btn.big{height:56px;font-size:17px;width:100%;border-radius:14px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:rgb(var(--brand-soft));color:rgb(var(--brand-d))}
.pill.warn{background:rgb(var(--warn-soft));color:rgb(var(--warn))}
.seller{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:99px;border:1px solid rgb(var(--line))}
.av{width:30px;height:30px;border-radius:50%;background:rgb(var(--brand));color:rgb(var(--onbrand));display:grid;place-items:center;font:700 12px var(--disp);flex:none}
.badge{position:absolute;top:-6px;right:-6px;background:rgb(var(--bad));color:#fff;border-radius:99px;font:700 11px var(--disp);min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.badge[hidden]{display:none}
.sale{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px}
.cat{min-width:0;display:flex;flex-direction:column;min-height:0;padding:12px 14px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{height:38px;padding:0 16px;border-radius:99px;border:1px solid rgb(var(--line));background:rgb(var(--surf));font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:rgb(var(--fore));color:rgb(var(--paper));border-color:transparent}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;align-content:start;padding-bottom:14px}
.prod{position:relative;text-align:left;background:rgb(var(--surf));border:1px solid rgb(var(--line));border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:132px}
.prod:active{transform:scale(.97)}
.prod .th{height:52px;border-radius:12px;display:grid;place-items:center;font:700 20px var(--disp);color:#04281b}
.prod b{font:600 14px/1.2 var(--disp)}
.prod .pr{margin-top:auto;font:700 15px var(--disp)}
.prod .st{font-size:12px}
.prod .tag{position:absolute;top:8px;right:8px}
.ticket{background:rgb(var(--surf));border-left:1px solid rgb(var(--line));display:flex;flex-direction:column;min-height:0}
.tk-h{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgb(var(--line))}
.cust{flex:1;display:flex;align-items:center;gap:10px;text-align:left;border:1px dashed rgb(var(--line));border-radius:12px;padding:6px 10px;min-height:48px;min-width:0}
.cust.set{border-style:solid;background:rgb(var(--surf2))}
.cust .t{min-width:0}.cust .t b{display:block;font:600 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lines{flex:1;overflow-y:auto;padding:4px 14px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:rgb(var(--mute));padding:20px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid rgb(var(--line));align-items:center}
.line b{font:600 14px/1.25 var(--disp)}
.line .imei{font-size:12px;color:rgb(var(--mute))}
.line .amt{font:700 15px var(--disp);text-align:right}
.step{display:inline-flex;align-items:center;border:1px solid rgb(var(--line));border-radius:10px}
.step button{width:40px;height:36px;display:grid;place-items:center}
.step span{min-width:24px;text-align:center;font-weight:600}
.opts{display:flex;gap:8px;padding:8px 14px;border-top:1px solid rgb(var(--line));overflow-x:auto;scrollbar-width:none}
.opt{height:38px;padding:0 12px;border-radius:10px;border:1px solid rgb(var(--line));display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.opt.on{border-color:rgb(var(--brand));background:rgb(var(--brand-soft));color:rgb(var(--brand-d))}
.tot{padding:10px 14px 14px;border-top:1px solid rgb(var(--line));display:flex;flex-direction:column;gap:6px}
.tot .r{display:flex;justify-content:space-between}
.tot .grand{font:700 26px var(--disp);align-items:baseline}
.mbar,.back{display:none}
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);display:none;z-index:40;align-items:center;justify-content:center}
.scrim.on{display:flex}
.sheet{background:rgb(var(--surf));border-radius:20px;width:min(520px,94vw);max-height:86dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgb(0 0 0/.35)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgb(var(--line))}
.sheet header h2{font-size:18px}
.sheet .bd{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid rgb(var(--line));border-radius:12px;min-height:52px}
.row b{font:600 14px var(--disp);display:block}
.inp{width:100%;height:48px;border:1px solid rgb(var(--line));border-radius:12px;padding:0 14px;background:rgb(var(--surf2));outline:0;font-size:16px}
.inp:focus{border-color:rgb(var(--brand));box-shadow:0 0 0 3px rgb(var(--brand)/.2)}
.lbl{font:600 12px var(--disp);color:rgb(var(--mute));margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pay,.done,.lock{position:fixed;inset:0;background:rgb(var(--paper));z-index:30;display:none;flex-direction:column}
.pay.on,.done.on,.lock.on{display:flex}
.lock{z-index:60;align-items:center;justify-content:center;gap:18px}
.pay-b{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr;max-width:1180px;width:100%;margin:0 auto}
.pay-l{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.pay-r{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.card{background:rgb(var(--surf));border:1px solid rgb(var(--line));border-radius:var(--r);padding:14px}
.falta{text-align:center;padding:16px 14px}
.falta small{font:600 12px var(--disp);text-transform:uppercase;letter-spacing:.06em;color:rgb(var(--mute))}
.falta .n{font:700 40px/1.1 var(--disp)}
.falta.ok .n{color:rgb(var(--ok))}
.meter{height:8px;border-radius:9px;background:rgb(var(--line));overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:rgb(var(--brand));transition:width .25s}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.meth{height:76px;border:1px solid rgb(var(--line));border-radius:14px;background:rgb(var(--surf));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:12px;text-align:center;padding:0 2px}
.meth.on{border-color:rgb(var(--brand));background:rgb(var(--brand-soft));color:rgb(var(--brand-d));box-shadow:0 0 0 2px rgb(var(--brand)/.25)}
.paid{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgb(var(--brand-soft));color:rgb(var(--fore))}
.paid b{font:600 14px var(--disp)}
.copy{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid rgb(var(--line));border-radius:10px;background:rgb(var(--surf2))}
.copy .k{font-size:11px;color:rgb(var(--mute));text-transform:uppercase}
.warnbox{background:rgb(var(--warn-soft));color:rgb(var(--warn));border-radius:12px;padding:10px 12px;font-size:13px}
.qr{width:140px;height:140px;display:block;margin:12px auto 0;background:#fff;padding:8px;border-radius:12px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pad button{height:60px;border-radius:16px;border:1px solid rgb(var(--line));background:rgb(var(--surf));font:600 22px var(--disp)}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgb(var(--brand))}.dots i.f{background:rgb(var(--brand))}
.done{align-items:center;justify-content:center;gap:12px;padding:20px;overflow-y:auto}
.check{width:64px;height:64px;border-radius:50%;background:rgb(var(--brand));color:rgb(var(--onbrand));display:grid;place-items:center;flex:none}
.receipt{background:#fff;color:#111;width:min(340px,100%);border-radius:10px;padding:14px;font:12px/1.5 ui-monospace,Menlo,monospace;box-shadow:0 6px 24px rgb(0 0 0/.15);flex:none}
.receipt hr{border:0;border-top:1px dashed #999;margin:6px 0}
.receipt .l{display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgb(var(--fore));color:rgb(var(--paper));padding:10px 16px;border-radius:12px;z-index:80;font-weight:600;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
.toast.on{opacity:1}
hr.s{border:0;border-top:1px solid rgb(var(--line));margin:8px 0}
@media (max-width:899px){
  .sale{grid-template-columns:minmax(0,1fr)}
  .brandname,.seller .nm,.hide-m{display:none}
  .ticket{position:fixed;inset:0;z-index:20;transform:translateY(100%);transition:transform .25s;border:0;visibility:hidden}
  .ticket.open{transform:none;visibility:visible}
  .back{display:inline-flex}
  .mbar{display:flex;position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;height:60px;border-radius:18px;background:rgb(var(--brand));color:rgb(var(--onbrand));align-items:center;justify-content:space-between;padding:0 18px;font:700 16px var(--disp);box-shadow:0 8px 24px rgb(0 0 0/.25)}
  .mbar.zero{display:none}
  .grid{grid-template-columns:repeat(2,1fr);padding-bottom:90px}
  .pay-b{grid-template-columns:1fr;overflow-y:auto;display:block}
  .pay-l{display:none}
  .pay-r{overflow:visible;padding-bottom:30px}
  .mgrid{grid-template-columns:repeat(4,1fr);gap:6px}
  .meth{height:64px;font-size:11px}
  .scrim{align-items:flex-end}
  .sheet{width:100%;border-radius:22px 22px 0 0;max-height:90dvh}
  .toast{bottom:100px}
}
@media (min-width:900px){ .only-m{display:none!important} .opts{flex-wrap:wrap} }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="logo"><i></i></div><span class="brandname">MobOS</span>
    <label class="searchbox"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Buscar producto, SKU o escanear IMEI" autocomplete="off" inputmode="search"></label>
    <button class="btn sq" data-act="scan" title="Escanear IMEI"><svg class="ico" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg></button>
    <button class="btn sq hide-m" data-act="parked" title="Ventas en espera"><svg class="ico" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span class="badge" id="pkb" hidden></span></button>
    <button class="btn sq" data-act="theme" title="Tema claro/oscuro"><svg class="ico" viewBox="0 0 24 24"><path d="M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10z"/></svg></button>
    <button class="seller" data-act="lock" title="Vendedor (PIN)"><span class="av">LM</span><span class="nm" style="font-weight:600">Lucía M.</span></button>
  </div>
  <div class="sale">
    <section class="cat">
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>
    <aside class="ticket" id="ticket"></aside>
  </div>
  <button class="mbar zero" id="mbar" data-act="openCart"></button>
</div>

<section class="pay" id="pay"></section>
<section class="done" id="done"></section>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="lock" id="lock">
  <div class="logo" style="width:56px;height:56px;border-radius:18px"><i style="width:22px;height:32px"></i></div>
  <h1 style="font-size:22px">Ingresá tu PIN</h1><div class="mute">Caja 1 · Sucursal Centro (demo: cualquier PIN de 4 dígitos)</div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const I={
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
 truck:'<path d="M2 6h12v10H2zM14 10h4l4 3v3h-8"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 note:'<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>',pause:'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
 doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>',back:'<path d="m15 5-7 7 7 7"/>',check:'<path d="m5 12 5 5 9-10"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>',cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
 bank:'<path d="M3 10 12 4l9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
 qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-4M14 20v1"/>',
 gift:'<rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-3 0-5-1-5-3s3-2 5 3c2-5 5-5 5-3s-2 3-5 3"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/>',
 wa:'<path d="M3 21l1.6-5A8.5 8.5 0 1 1 8 19.4z"/>'
};
const ic=(n,s)=>`<svg class="ico" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${I[n]}</svg>`;
const num=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmt=n=>'Gs. '+num(n);
const usd=n=>'US$ '+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2});

const CATS=['Todo','Celulares','Accesorios','Audio','Servicios'];
const COL=['#15d7b8','#7dd3fc','#fcd34d','#fda4af','#c4b5fd','#86efac'];
const P=[
 {id:1,n:'iPhone 15 128GB Negro',c:'Celulares',p:5200000,w:4850000,cond:'Nuevo',imeis:['356938035643809','356938035643817','356938035643825']},
 {id:2,n:'Galaxy A15 128GB',c:'Celulares',p:1450000,w:1290000,cond:'Nuevo',imeis:['352099001761481','352099001761499']},
 {id:3,n:'Redmi Note 13 256GB',c:'Celulares',p:1980000,w:1790000,cond:'Nuevo',imeis:['867530902345671']},
 {id:4,n:'iPhone 12 64GB Usado A',c:'Celulares',p:2650000,w:2400000,cond:'Usado',imeis:['353879234252633','353879234252641']},
 {id:5,n:'Cargador 20W USB-C',c:'Accesorios',p:90000,w:70000,s:34},
 {id:6,n:'Funda silicona iPhone 15',c:'Accesorios',p:60000,w:40000,s:22},
 {id:7,n:'Vidrio templado 9H',c:'Accesorios',p:35000,w:22000,s:80},
 {id:8,n:'Cable USB-C 1m',c:'Accesorios',p:45000,w:30000,s:51},
 {id:9,n:'AirPods 3ra gen',c:'Audio',p:1350000,w:1200000,s:5},
 {id:10,n:'Parlante JBL Go 3',c:'Audio',p:420000,w:360000,s:9},
 {id:11,n:'Cambio de pantalla',c:'Servicios',p:350000,w:350000,s:99,svc:1},
 {id:12,n:'Gift card Gs. 100.000',c:'Servicios',p:100000,w:100000,s:99,svc:1}
];
const CUS=[
 {id:1,n:'Marcos Benítez',t:'minorista',tel:'+595 981 234 567',limit:0,debt:0},
 {id:2,n:'Tienda Ñandutí S.A.',t:'mayorista',tel:'+595 21 555 010',limit:5000000,debt:1200000},
 {id:3,n:'Carolina Giménez',t:'minorista',tel:'+595 991 765 432',limit:1000000,debt:0}
];
const BANKS=[
 {id:'itau',n:'Itaú',tit:'MobOS Celulares S.R.L.',cta:'8801234-5',alias:'mobos.itau'},
 {id:'ueno',n:'Ueno',tit:'MobOS Celulares S.R.L.',cta:'1299007',alias:'mobos.ueno'},
 {id:'fam',n:'Familiar',tit:'MobOS Celulares S.R.L.',cta:'30-4455-2',alias:'0991 000 111'}
];
const S={cat:'Todo',q:'',cart:[],cust:null,disc:{t:'pct',v:0},mode:'mostrador',addr:'',note:'',cartOpen:false,pays:[],m:null,rate:7350,parked:[],n:1042,dark:false};

const priceOf=p=>S.cust&&S.cust.t==='mayorista'?p.w:p.p;
const SHIP={mostrador:0,retiro:0,delivery:25000,encomienda:35000};
function T(){
 const sub=S.cart.reduce((a,l)=>a+priceOf(l.p)*l.q,0);
 let d=S.disc.t==='pct'?sub*S.disc.v/100:Math.min(S.disc.v,sub);d=Math.round(d);
 const ship=S.cart.length?SHIP[S.mode]:0, total=sub-d+ship;
 const paid=S.pays.reduce((a,x)=>a+x.applied,0);
 return{sub,d,ship,total,paid,falta:Math.max(0,total-paid),count:S.cart.reduce((a,l)=>a+l.q,0)};

function qrSvg(){let s='',r=7;const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
 s+=fin(0,0)+fin(14,0)+fin(0,14);for(let y=0;y<21;y++)for(let x=0;x<21;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;r=(r*1103515245+12345)&0x7fffffff;if(r%3===0)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`}return s}

 scan:d=>{const pool=d.id?[P.find(p=>p.id==d.id)]:P.filter(p=>p.imeis&&freeUnits(p).length);const p=pool[0];if(!p||!freeUnits(p).length)return toast('Sin unidades');addUnit(p,freeUnits(p)[0])},
 inc:d=>{const l=S.cart[d.i];if(l.q<l.p.s)l.q++;render()},
 dec:d=>{const l=S.cart[d.i];l.q>1?l.q--:S.cart.splice(d.i,1);render()},
 del:d=>{S.cart.splice(d.i,1);render()},
 openCart:()=>{S.cartOpen=true;renderTicket()},closeCart:()=>{S.cartOpen=false;renderTicket()},
 cust:custSheet,
 setCust:d=>{S.cust=CUS.find(c=>c.id==d.id);close();render();if(S.m)pickMethod(S.m.id);toast(S.cust.t==='mayorista'?'Precios mayoristas aplicados':'Cliente asignado')},
 custNone:()=>{S.cust=null;close();render()},
 newCust:()=>open(hd('Cliente nuevo')+`<div class="bd"><div><label class="lbl" for="nn">Nombre</label><input class="inp" id="nn"></div><div><label class="lbl" for="nt">Teléfono</label><input class="inp" id="nt" inputmode="tel" value="+595 "></div>
  <div class="mute">Solo nombre y teléfono para vender rápido; el resto se completa después en la ficha.</div><button class="btn pri big" data-act="saveCust">Guardar y asignar</button></div>`),
 saveCust:()=>{const c={id:CUS.length+1,n:$('#nn').value.trim()||'Cliente nuevo',t:'minorista',tel:$('#nt').value,limit:0,debt:0};CUS.push(c);S.cust=c;close();render()},
 disc:()=>open(hd('Descuento')+`<div class="bd"><div class="seg"><button class="chip ${S.disc.t==='pct'?'on':''}" data-act="dt" data-v="pct">Porcentaje %</button><button class="chip ${S.disc.t==='gs'?'on':''}" data-act="dt" data-v="gs">Monto Gs.</button></div>
  <input class="inp" id="dv" inputmode="decimal" value="${S.disc.v||''}" placeholder="0"><div class="seg">${[5,10,15].map(v=>`<button class="chip" data-act="dq" data-v="${v}">${v}%</button>`).join('')}</div>
  <button class="btn pri big" data-act="dok">Aplicar</button></div>`),
 dt:d=>{S.disc.t=d.v;ACT.disc()},dq:d=>{$('#dv').value=d.v;S.disc.t='pct'},
 dok:()=>{S.disc.v=parseFloat($('#dv').value.replace(',','.'))||0;close();render()},
 ship:()=>open(hd('Entrega')+`<div class="bd"><div class="seg">${['mostrador','retiro','delivery','encomienda'].map(k=>`<button class="chip ${S.mode===k?'on':''}" data-act="mode" data-v="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
  ${['delivery','encomienda'].includes(S.mode)?`<div><label class="lbl" for="ad">Dirección / destino</label><input class="inp" id="ad" value="${S.addr}" placeholder="Barrio, ciudad, referencia"></div><div class="mute">Costo de envío ${fmt(SHIP[S.mode])} sumado al total.</div>`:'<div class="mute">Sin costo de envío.</div>'}
  <button class="btn pri big" data-act="shipok">Listo</button></div>`),
 mode:d=>{S.mode=d.v;render();ACT.ship()},
 shipok:()=>{const a=$('#ad');if(a)S.addr=a.value;close();render()},
 note:()=>open(hd('Nota de la venta')+`<div class="bd"><textarea class="inp" id="nt2" style="height:110px;padding:12px" placeholder="Ej: entregar con caja original">${S.note}</textarea><button class="btn pri big" data-act="noteok">Guardar</button></div>`),
 noteok:()=>{S.note=$('#nt2').value;close();render()},
 quote:()=>{const t=T();open(hd('Cotización COT-0007')+`<div class="bd"><div class="card">${S.cart.length?S.cart.map(l=>`<div style="display:flex;justify-content:space-between"><span>${l.q}× ${l.p.n}</span><b>${fmt(priceOf(l.p)*l.q)}</b></div>`).join('')+`<hr class="s"><div style="display:flex;justify-content:space-between;font:700 18px var(--disp)"><span>Total</span><span>${fmt(t.total)}</span></div>`:'<span class="mute">Agregá productos primero.</span>'}</div>
  <div class="mute">Válida por 7 días. No descuenta stock ni registra cobro.</div><div class="seg"><button class="btn" data-act="toast" data-v="Cotización enviada por WhatsApp">${ic('wa')}WhatsApp</button><button class="btn" data-act="toast" data-v="Cotización enviada a imprimir">${ic('print')}Imprimir</button></div></div>`)},
 parkNow:()=>{if(!S.cart.length)return toast('No hay nada para poner en espera');S.parked.push({cart:S.cart,cust:S.cust,disc:S.disc,mode:S.mode,t:new Date()});const n=S.parked.length;S.cart=[];S.cust=null;S.disc={t:'pct',v:0};S.mode='mostrador';S.cartOpen=false;render();toast('Venta en espera #'+n)},
 parked:()=>open(hd('Ventas en espera')+`<div class="bd">${S.parked.length?S.parked.map((p,i)=>`<button class="row" data-act="resume" data-i="${i}"><div style="flex:1"><b>${p.cust?p.cust.n:'Consumidor final'}</b><span class="mute">${p.cart.length} ítem(s) · ${p.t.toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'})}</span></div>${ic('back',18)}</button>`).join(''):'<div class="mute">No hay ventas en espera.</div>'}</div>`),
 resume:d=>{if(S.cart.length)ACT.parkNow();const p=S.parked.splice(d.i,1)[0];S.cart=p.cart;S.cust=p.cust;S.disc=p.disc;S.mode=p.mode;close();render()},
 pay:startPay,
 payBack:()=>{$('#pay').classList.remove('on');S.cartOpen=true;S.pays=[];render()},
 meth:d=>pickMethod(d.id),
 quick:d=>{S.m.amt=+d.v;renderPay()},quickusd:d=>{S.m.usd=+d.v;renderPay()},
 bank:d=>{S.m.bank=d.id;renderPay()},cuotas:d=>{S.m.cuotas=+d.v;renderPay()},due:d=>{S.m.due=+d.v;renderPay()},
 copy:d=>{try{navigator.clipboard.writeText(d.v)}catch(e){}toast('Copiado: '+d.v)},
 gcCheck:()=>{S.m.gcok=S.m.code.trim().toUpperCase()==='GC-2048';S.m.gcok?renderPay():toast('Código no válido')},
 approve:()=>{if($('#apin').value==='1234'){S.m.appr=true;updM();toast('Aprobado por administración')}else toast('PIN incorrecto')},
 addPay,rmPay:d=>{S.pays.splice(d.i,1);pickMethod(S.m?S.m.id:'cashgs')},
 finish,newSale:reset,
 toast:d=>toast(d.v),
 theme:()=>{S.dark=!S.dark;document.documentElement.dataset.theme=S.dark?'dark':'light'},
 lock:()=>{pin='';drawDots();$('#lock').classList.add('on')},
 close
};
document.addEventListener('click',e=>{if(e.target.id==='scrim')return close();const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a.dataset)});
document.addEventListener('input',e=>{
 const k=e.target.dataset.in;if(!k)return;const v=e.target.value,m=S.m;
 if(k==='cq')return custList(v);
 if(!m)return;
 if(k==='amt'){const n=parseInt(v.replace(/\D/g,''))||0;m.amt=n;e.target.value=n?num(n):''}
 if(k==='usd')m.usd=parseFloat(v.replace(',','.'))||0;
 if(k==='rate')S.rate=parseInt(v.replace(/\D/g,''))||1;
 if(k==='ref')m.ref=v;
 if(k==='code')m.code=v;
 updM();
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;const v=S.q.trim();
 if(/^\d{15}$/.test(v)){const p=P.find(p=>p.imeis&&freeUnits(p).includes(v));if(p){addUnit(p,v);S.q='';e.target.value=''}}
 renderCat()});
function render(){renderCat();renderTicket()}
/* PIN del vendedor */
let pin='';const drawDots=()=>$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pin.length?'f':''}"></i>`).join('');
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('');
$('#pad').addEventListener('click',e=>{const k=e.target.dataset.k;if(!k)return;pin=k==='⌫'?pin.slice(0,-1):(pin+k).slice(0,4);drawDots();if(pin.length===4)setTimeout(()=>$('#lock').classList.remove('on'),150)});
drawDots();
/* ayudas para capturas */
window.POS={S,ACT,seed(){$('#lock').classList.remove('on');ACT.unit({id:1,imei:'356938035643809'});ACT.add({id:6});ACT.add({id:7});ACT.setCust({id:1})}};
render();
if(location.hash==='#demo')POS.seed();else $('#lock').classList.add('on');
</script>
</body>
</html>
