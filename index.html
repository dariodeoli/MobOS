    <script>
      try {
        if (localStorage.getItem('mobos:theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {}
    </script>

         (TLS/DNS) ahorra tiempo en la primera consulta de cada carga. -->
    <link rel="preconnect" href="https://api.moboss.online" crossorigin />
    <link rel="dns-prefetch" href="https://api.moboss.online" />

    <meta name="theme-color" content="#f6f8fb" />
    <script>
      ;(() => {
        const destinations = {
          'controlaria.online': 'https://moboss.online',
          'www.controlaria.online': 'https://moboss.online',
          'app.controlaria.online': 'https://app.moboss.online',
        }
        const destination = destinations[window.location.hostname]
        if (destination) window.location.replace(`${destination}${window.location.pathname}${window.location.search}${window.location.hash}`)
      })()
    </script>
